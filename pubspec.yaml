name: klimmeck_guide
description: "A game type app, integrated with Twitch and Discord, to let players interact during live streams"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  #Bloc
  flutter_bloc: ^9.1.1

  #App Icon
  flutter_launcher_icons: ^0.14.4

  #HTTP
  graphql: ^5.1.3
  dio: ^5.4.0

  #PAYMENTS
  flutter_stripe: ^11.5.0
  pay: ^3.2.1
  iban: ^1.0.1
  flutter_credit_card: ^4.1.0

  #Firebase
  firebase_messaging: ^15.2.9
  firebase_auth: ^5.6.2
  firebase_core: ^3.15.1

  shared_preferences: ^2.0.12
  auto_size_text: ^3.0.0
  permission_handler: ^12.0.1
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^19.3.0
  url_launcher: ^6.1.7
  cached_network_image: ^3.2.3
  flutter_svg: ^2.2.0
  google_fonts: ^6.2.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_icons:
  ios: true
  remove_alpha_ios: true
  android: "launcher_icon"
  image_path_ios: "assets/icons/appIcon/app_icon_ios.png"
  image_path_android: "assets/icons/appIcon/app_icon_android.png"
  #comando da eseguire per creare icona app: flutter pub run flutter_launcher_icons:main


flutter:

  uses-material-design: true
  generate: true

  assets:
    - assets/appIcon/
